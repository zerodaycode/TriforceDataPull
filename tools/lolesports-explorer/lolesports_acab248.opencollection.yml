      value: "application/json"
    - name: "accept"
      value: "application/graphql-response+json,application/json;q=0.9"
docs: |-
  Exported with gql_tool.py from the site manifest (build acab248).

  - The server only runs the operations it knows, by sha256 hash. Free GraphQL queries are refused (PERSISTED_QUERY_ID_REQUIRED).
  - It needs the apollographql-* headers and a lolesports.com Referer/Origin, otherwise 401 "No client headers set".
  - Use the environment "lolesports.com", change `hl` there for other languages.
  - The CDN caches the answers 60-120 s, plus stale-while-revalidate.
  - Mutations are not included, they need a logged-in Riot account and they change data.
