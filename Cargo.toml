[package]
name = "triforce-data-pull"
version = "0.0.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# develop branch, pinned to a commit (docs/decisions/0001-use-canyon-sql-develop-branch.md)
canyon_sql = { git = "https://github.com/zerodaycode/Canyon-SQL.git", rev = "1c81b3b1c1982c33aeadd1d214bc2aeef95253b4", features = ["postgres", "migrations"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
color-eyre = { version = "0.6.5", default-features = false }
itertools = "0.15.0"

chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
tokio = { version = "1.53.3", features = ["full"] }
