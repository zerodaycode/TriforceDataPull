[package]
name = "triforce-data-pull"
version = "0.0.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

canyon_sql = { git = "https://github.com/zerodaycode/Canyon-SQL.git", branch = "main", features = ["postgres", "migrations"] }
# canyon_sql = { version = "0.5.1", features = ["postgres", "migrations"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
color-eyre = { version = "0.6.5", default-features = false }
itertools = "0.15.0"

chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
tokio = { version = "1.53.3", features = ["full"] }
